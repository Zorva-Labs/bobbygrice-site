name = "bobbygrice"
compatibility_date = "2026-09-17"
pages_build_output_dir = "dist"

[vars]
STAFF_EMAIL = "bobbynalice@yahoo.com, michael@nashvilleswebdesign.com"
MAIL_DEFAULT_REPLY = "bobbynalice@yahoo.com"
MAIL_FROM = "Bobby G. Rice website <website@forms.bobbygrice.com>"
SITE_DOMAIN = "bobbygrice.com"
SITE_NAME = "Bobby G. Rice"
GEO_ALLOW = "US,CA,GB"
CF_ZONE_ID = ""

[[d1_databases]]
binding = "DB"
database_name = "bobbygrice-analytics"
database_id = "671dde3c-2b21-413f-8535-c324c60580bf"

# Lead alerts go out through workers/mail (Cloudflare Email Routing); Pages cannot
# hold the send_email binding itself, so it calls that Worker here.
[[services]]
binding = "MAIL"
service = "bobbygrice-mail"
